<!doctype html>
<html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مشوار • أول فرصة</title>
<style>
:root{--bg:#101b22;--paper:#eef0e8;--gold:#edc36b;--muted:#abbdbf;--line:#33484d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font:16px/1.6 system-ui,Arial}header{padding:22px 5vw;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}header strong{font-size:28px;letter-spacing:2px}header small{color:var(--gold)}main{max-width:1100px;margin:auto;padding:28px 20px}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:2px}h1{font-size:clamp(32px,6vw,60px);line-height:1.2;margin:14px 0}h2{font-size:24px;margin:10px 0}p{color:var(--muted)}.layout{display:grid;grid-template-columns:1.35fr 1fr;gap:34px}.pitch{position:relative;min-height:290px;background:repeating-linear-gradient(90deg,#214d42 0 12.5%,#245446 12.5% 25%);border:16px solid #1a3033;border-radius:4px;overflow:hidden}.pitch svg{width:100%;height:100%;min-height:260px}.badge{font-size:80px;color:var(--gold);font-weight:900;line-height:1}.panel{border-top:1px solid var(--line);padding:18px 0}.stats{display:flex;gap:22px;flex-wrap:wrap;margin:20px 0}.stats span{font-size:12px;color:var(--muted)}.stats b{display:block;font-size:25px;color:var(--paper)}button{font:inherit;cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:5px;padding:13px 18px;text-align:right}button:hover{border-color:var(--gold)}button:focus-visible{outline:3px solid var(--gold);outline-offset:3px}button[aria-pressed=true]{border-color:var(--gold);background:#34392e}.primary{background:var(--gold);color:#18252a;font-weight:800;border:0;text-align:center;width:100%;margin-top:18px}.choices{display:grid;gap:9px}.choices button small{display:block;color:var(--muted);font-size:12px}.row{display:flex;justify-content:space-between;gap:12px}.score{direction:ltr;text-align:center;font-size:55px;font-weight:800}.timeline{max-height:310px;overflow:auto;padding:0;list-style:none}.timeline li{padding:12px 0;border-bottom:1px solid var(--line)}.timeline b{color:var(--gold);margin-left:14px}.notice{border-right:3px solid var(--gold);padding:8px 14px;background:#ffffff05}.steps{display:flex;gap:6px;margin-bottom:25px}.steps span{height:4px;flex:1;background:var(--line)}.steps .on{background:var(--gold)}footer{padding:20px;text-align:center;font-size:12px;color:var(--muted)}.ball{transition:cx .8s,cy .8s}.player{fill:#edc36b}.name{background:transparent;border:0;border-bottom:1px solid var(--gold);color:white;font:inherit;padding:10px;width:100%;margin:8px 0 22px}@media(max-width:700px){.layout{grid-template-columns:1fr;gap:20px}main{padding:20px 16px}.pitch{min-height:220px}.pitch svg{min-height:210px}header{padding:14px 20px}h1{font-size:36px}.stats{gap:18px}}@media(prefers-reduced-motion:reduce){.ball{transition:none}}
</style>
<header><strong>مشوار<span style="color:var(--gold)">.</span></strong><small>أول فرصة / تجربة قصيرة</small></header><main id="app"></main><footer>تجربة قرارات خيالية من 3 مباريات، مش موسم كامل. مفيش تحكّم يدوي أو حفظ بعد قفل الصفحة.</footer>
<script>
'use strict';
const fresh=()=>({phase:'intro',name:'سيف',week:0,skill:50,energy:80,trust:45,points:0,train:'tech',role:'link',pace:'balanced',minute:0,score:[0,0],events:[],history:[],seed:12345,contributions:0});let s=fresh();let timer=null;
const fixtures=[{name:'الاختبار الأول',style:'خصم بيضغط بدري',hint:'الربط يساعدك تخرج من الضغط، بس لو هتضغط بدورك هتصرف طاقة أكتر.',target:'link'},{name:'مكان في التشكيل',style:'دفاع واقف ورا',hint:'الجري خلف الدفاع يزود خطورتك هنا؛ محتاج تدخل بطاقة كويسة.',target:'run'},{name:'عين الكشّاف',style:'منافس متوازن',hint:'آخر فرصة في التجربة. اختار دور يناسب تجهيزك وغيّر الإيقاع وقت اللزوم.',target:'link'}];
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const cap=x=>Math.max(0,Math.min(100,x));
function rng(){s.seed=(s.seed*1664525+1013904223)>>>0;return s.seed/4294967296}
function stats(){return `<div class="stats"><span>المهارة<b>${s.skill}</b></span><span>الطاقة<b>${s.energy}</b></span><span>ثقة المدرب<b>${s.trust}</b></span><span>النقاط<b>${s.points}</b></span></div>`}
function pitch(){return `<div class="pitch"><svg viewBox="0 0 600 340" role="img" aria-label="رسم توضيحي لمكان الهجمة، مش محاكاة حركة لاعبين"><g fill="none" stroke="#c8e5cb66" stroke-width="2"><rect x="20" y="20" width="560" height="300"/><path d="M300 20V320M20 85H100V255H20M580 85H500V255H580"/><circle cx="300" cy="170" r="48"/></g><g fill="#7cd6cc"><circle cx="90" cy="170" r="10"/><circle cx="215" cy="95" r="10"/><circle cx="215" cy="245" r="10"/><circle cx="330" cy="120" r="10"/></g><g fill="#ed8b78"><circle cx="510" cy="170" r="10"/><circle cx="405" cy="95" r="10"/><circle cx="405" cy="245" r="10"/></g><circle class="player" cx="330" cy="220" r="13"/><text x="330" y="225" text-anchor="middle" fill="#172c30" font-size="12">10</text><circle class="ball" cx="${s.minute?180+(s.minute*7)%310:300}" cy="${s.minute?110+(s.minute*3)%120:170}" r="6" fill="white"/></svg></div>`}
function choice(group,value,title,desc){return `<button data-group="${group}" data-value="${value}" aria-pressed="${s[group]===value}">${title}<small>${desc}</small></button>`}
function render(){const app=document.getElementById('app');const f=fixtures[Math.min(s.week,2)];let body='';
if(s.phase==='intro')body=`<div class="layout"><section><div class="eyebrow">الفصل صفر • لاعب لسه بيبدأ</div><h1>موهبتك بداية.<br>قراراتك هي المشوار.</h1><p>3 مباريات عشان تثبت نفسك. جهّز لاعبك، اختار دوره، وتابع الماتش. في الاستراحة هتقدر تغيّر الإيقاع.</p><label for="name">اسم لاعبك</label><input id="name" class="name" maxlength="24" value="سيف"><button class="primary" id="begin">ابدأ مشوارك ←</button></section><section>${pitch()}<p class="notice">هدفك: توصل بثقة المدرب لـ60 عشان تكسب دعوة لتجربة أعلى. الفوز يساعد، لكن مساهمتك كمان محسوبة.</p></section></div>`;
if(s.phase==='prep')body=`<div class="steps">${fixtures.map((_,i)=>`<span class="${i<=s.week?'on':''}"></span>`).join('')}</div><div class="layout"><section><div class="eyebrow">المباراة ${s.week+1} من 3 • ${esc(s.name)}</div><h1>${f.name}</h1><p>${f.style}</p>${pitch()}${stats()}<p class="notice">${f.hint}</p></section><section><h2>الأسبوع ده هتجهّز إزاي؟</h2><div class="choices">${choice('train','tech','تدريب فني','مهارة +6 / طاقة −12')}${choice('train','rest','استشفاء','طاقة +18 / مفيش زيادة مهارة')}${choice('train','team','تدريب جماعي','مهارة +2 / ثقة +4 / طاقة −6')}</div><div class="panel"><h2>دورك في الملعب</h2><div class="choices">${choice('role','link','اربط اللعب','مناسب للخروج من الضغط')}${choice('role','run','اجري خلف الدفاع','مناسب للدفاع المتراجع؛ تكلفة طاقة أعلى')}</div></div><button class="primary" id="kickoff">اعتمد تجهيزك وابدأ الماتش</button></section></div>`;
if(['match','half'].includes(s.phase))body=`<div class="layout"><section><div class="row" style="direction:ltr"><span dir="rtl">${esc(s.name)} / فريقك</span><span>${s.minute}′</span><span>المنافس</span></div><div class="score">${s.score[0]} : ${s.score[1]}</div>${pitch()}<p>عرض أحداث تلقائي — كل لقطة خطوة في نموذج احتمالي مبسّط.</p></section><section><div class="eyebrow">${s.phase==='half'?'بين الشوطين':'على خط الملعب'}</div><h2>${s.phase==='half'?'لسه تقدر تغيّر الحكاية.':'قراراتك بتظهر في اللعب.'}</h2>${stats()}<ul class="timeline" aria-live="polite">${s.events.slice().reverse().map(e=>`<li><b>${e.minute}′</b>${e.text}</li>`).join('')}</ul>${s.phase==='half'?`<div class="choices">${choice('pace','balanced','كمّل بتوازن','خطورة وتكلفة طاقة متوسطة')}${choice('pace','press','ارفع الضغط','فرص أكتر، استهلاك طاقة أعلى ومخاطرة دفاعية')}${choice('pace','save','وفّر مجهودك','فرص أقل، استهلاك طاقة أقل')}</div><button class="primary" id="resume">ابدأ الشوط التاني</button>`:'<button id="advance" class="primary">اللقطة التالية الآن</button>'}</section></div>`;
if(s.phase==='result')body=`<div class="layout"><section><div class="eyebrow">صافرة النهاية • المباراة ${s.week+1}</div><h1>${s.score[0]>s.score[1]?'ثلاث نقاط في الجيب.':s.score[0]===s.score[1]?'نقطة.. ودرس جديد.':'خسارة مش نهاية.'}</h1><div class="score">${s.score[0]} : ${s.score[1]}</div>${pitch()}</section><section><h2>الأثر على مشوارك</h2>${stats()}<p class="notice">${s.history[s.week].summary}</p><p>مساهمات هجومية ناجحة: ${s.contributions}. الطاقة قلت بسبب المجهود؛ الاستشفاء متاح قبل المباراة الجاية.</p><button id="next" class="primary">${s.week===2?'اعرف نتيجة التجربة':'الأسبوع التالي ←'}</button></section></div>`;
if(s.phase==='end')body=`<div class="layout"><section><div class="eyebrow">نهاية التجربة • ${esc(s.name)}</div><h1>${s.trust>=60?'دعوة جديدة.<br>باب اتفتح.':'المشوار محتاج<br>محاولة تانية.'}</h1><p>${s.trust>=60?'وصلت بثقة المدرب لـ60 أو أكتر، فكسبت دعوة لتجربة أعلى.':'ثقة المدرب لسه أقل من60. جرّب تجهيز ودور مختلفين وشوف تأثيرهم.'}</p>${stats()}<button class="primary" id="restart">جرّب مشوار باختيارات مختلفة</button></section><section><div class="badge">10</div><h2>حكاية الـ3 مباريات</h2>${s.history.map((h,i)=>`<div class="panel"><b>${fixtures[i].name} · ${h.score.join(' : ')}</b><p>${h.summary}</p></div>`).join('')}<p>نفس البداية العشوائية في كل محاولة تساعدك تقارن اختياراتك. النموذج تجريبي وغير معاير لواقعية كرة القدم.</p></section></div>`;
app.innerHTML=body;app.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{const group=b.dataset.group,value=b.dataset.value;s[group]=value;render();document.querySelector(`[data-group="${group}"][data-value="${value}"]`)?.focus()});const bind=(id,fn)=>{const e=document.getElementById(id);if(e)e.onclick=fn};bind('begin',()=>{s.name=(document.getElementById('name').value.trim()||'اللاعب').slice(0,24);s.phase='prep';render()});bind('kickoff',kickoff);bind('advance',tick);bind('resume',()=>{s.phase='match';render();schedule()});bind('next',()=>{s.week++;s.phase=s.week===3?'end':'prep';render()});bind('restart',()=>{clearTimeout(timer);s=fresh();render()})}
function kickoff(){if(s.phase!=='prep')return;if(s.train==='tech'){s.skill=cap(s.skill+6);s.energy=cap(s.energy-12)}else if(s.train==='rest')s.energy=cap(s.energy+18);else{s.skill=cap(s.skill+2);s.trust=cap(s.trust+4);s.energy=cap(s.energy-6)}s.phase='match';s.minute=0;s.score=[0,0];s.events=[];s.contributions=0;s.pace='balanced';render();schedule()}
function schedule(){clearTimeout(timer);if(s.phase==='match'&&!document.hidden)timer=setTimeout(tick,1900)}
function tick(){clearTimeout(timer);if(s.phase!=='match')return;s.minute+=15;const fit=s.role===fixtures[s.week].target;const prob=Math.max(.12,Math.min(.85,.20+s.skill*.003+s.energy*.002+(fit?.12:0)+(s.pace==='press'?.08:s.pace==='save'?-.07:0)));s.energy=cap(s.energy-(s.pace==='press'?7:s.pace==='save'?2:4)-(s.role==='run'?1:0));let text;if(rng()<prob){s.contributions++;if(rng()<.45){s.score[0]++;text='هجمة شاركت فيها انتهت بجول لفريقك!'}else text='ساهمت في هجمة كويسة، لكن الفرصة ضاعت.'}else text='المنافس قفل المساحة؛ الهجمة ما كملتش.';if(rng()<.13+(s.pace==='press'?.10:0)){s.score[1]++;text+=' المنافس سجّل في هجمة مقابلة.'}s.events.push({minute:s.minute,text});if(s.minute===45)s.phase='half';if(s.minute===90){const delta=s.contributions*2+(s.score[0]>s.score[1]?5:s.score[0]===s.score[1]?1:-3);s.trust=cap(s.trust+delta);s.points+=s.score[0]>s.score[1]?3:s.score[0]===s.score[1]?1:0;s.history.push({score:[...s.score],summary:`ثقة المدرب ${delta>=0?'+':''}${delta}: ${s.contributions} مساهمات ×2، وتأثير النتيجة ${s.score[0]>s.score[1]?'+5':s.score[0]===s.score[1]?'+1':'−3'}. ${fit?'دورك ناسب أسلوب المنافس فزادت فرصة نجاح الهجمات.':'دورك ما أخدش ميزة مواجهة أسلوب المنافس.'}`});s.phase='result'}render();schedule()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)clearTimeout(timer);else schedule()});window.career={snapshot:()=>JSON.parse(JSON.stringify(s)),choose:(k,v)=>{if(!['train','role','pace'].includes(k))throw Error('invalid choice');s[k]=v},kickoff,tick,begin:()=>{s.phase='prep';render()},next:()=>{if(s.phase==='result'){s.week++;s.phase=s.week===3?'end':'prep';render()}},resume:()=>{if(s.phase==='half'){s.phase='match';render()}},reset:()=>{clearTimeout(timer);s=fresh();render()}};render();
</script></html>
